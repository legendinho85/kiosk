  <script>
    // Printed QR codes may open /b/<book-id> (a server rewrite to this page).
    // Point relative URLs back at the app folder before anything loads;
    // js/main.js then turns the address into #/b/<book-id>.
    (function () {
      var m = /^(.*\/)b\/[a-z0-9-]+\/?$/.exec(location.pathname);
      if (!m) return;
      var base = document.createElement('base');
      base.href = m[1];
      document.head.appendChild(base);
    })();
  </script>

  <script>
    // If the app hasn't started after a while (slow network, a blocked
    // script), say so rather than spinning for ever.
    setTimeout(function () {
