<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <rect width="1600" height="700" fill="#FFF4E0"/>
  <rect y="700" width="1600" height="300" fill="#E8C9A0"/>
  <circle cx="260" cy="220" r="140" fill="#9FDCF7" stroke="#2B2A33" stroke-width="6"/>
  <circle cx="300" cy="190" r="40" fill="#FFCB3D"/>
  <g id="p2-otter-cheer"><g transform="translate(420 900)"><use href="#d-otter" transform="scale(1.3)"/></g></g>
  <!-- The bag, and what is inside it (under the flap) -->
  <g stroke="#2B2A33" stroke-width="6" stroke-linejoin="round">
    <rect x="950" y="480" width="500" height="420" rx="40" fill="#B7302A"/>
  </g>
  <g id="p2-shirt" stroke="#2B2A33" stroke-width="6" stroke-linejoin="round">
    <path d="M1030 560 L 1110 520 L 1290 520 L 1370 560 L 1400 650 L 1340 670 L 1330 860 L 1070 860 L 1060 670 L 1000 650 Z" fill="#E4483A"/>
    <rect x="1080" y="570" width="240" height="84" rx="16" fill="#fff" fill-opacity=".25" stroke="none"/>
    <use href="#d-star" class="sb-print-only" transform="translate(1200 612) scale(.8)"/>
    <text id="p2-name" class="sb-name" data-form="upper" data-anim="write" data-wrap="2" data-max-width="230" x="1200" y="636" text-anchor="middle" font-family="Fredoka, Andika, sans-serif" font-weight="700" font-size="62" fill="#fff" stroke="none">NAME</text>
    <text x="1200" y="800" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="140" fill="#fff" stroke="none">1</text>
  </g>
  <g id="p2-socks" data-reveal="" stroke="#2B2A33" stroke-width="6"><ellipse cx="1020" cy="850" rx="44" ry="28" fill="#fff"/><ellipse cx="1390" cy="850" rx="44" ry="28" fill="#fff"/></g>
  <g id="p2-flap" stroke="#2B2A33" stroke-width="6" stroke-linejoin="round">
    <rect x="950" y="480" width="500" height="420" rx="40" fill="#E4483A"/>
    <rect x="950" y="640" width="500" height="70" fill="#fff"/>
    <path d="M960 500 H 1440" stroke="#FFCB3D" stroke-width="14"/>
    <text x="1200" y="820" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="56" fill="#fff" stroke="none">KIT</text>
  </g>
  <g id="p2-sparkles" class="sb-digital">
    <use href="#d-star" class="sb-twinkle" transform="translate(990 460)"/>
    <use href="#d-star" class="sb-twinkle" transform="translate(1420 440) scale(1.2)"/>
  </g>
</svg>
