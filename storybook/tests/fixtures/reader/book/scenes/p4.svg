<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <rect width="1600" height="480" fill="#9FDCF7"/>
  <rect y="470" width="1600" height="530" fill="#74C655"/>
  <path d="M800 470 V 1000" stroke="#fff" stroke-width="10"/>
  <g id="p4-crowd-wrap">
    <rect x="200" y="240" width="1200" height="230" rx="20" fill="#D9E8FF" stroke="#2B2A33" stroke-width="6"/>
    <g id="p4-crowd" stroke="#2B2A33" stroke-width="5">
      <circle cx="300" cy="300" r="30" fill="#FFD6E0"/><circle cx="420" cy="300" r="30" fill="#FFE9A8"/><circle cx="1180" cy="300" r="30" fill="#FFFFFF"/><circle cx="1300" cy="300" r="30" fill="#FFD6E0"/>
      <circle cx="360" cy="400" r="30" fill="#FFFFFF"/><circle cx="1240" cy="400" r="30" fill="#FFE9A8"/>
    </g>
    <rect x="500" y="320" width="600" height="100" rx="12" fill="#fff" stroke="#2B2A33" stroke-width="6"/>
    <text x="600" y="395" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="64" fill="#E4483A">GO</text>
    <text id="p4-name" class="sb-name" data-form="upper" data-anim="write" data-max-width="400" x="870" y="395" text-anchor="middle" font-family="Fredoka, Andika, sans-serif" font-weight="700" font-size="64" fill="#E4483A">NAME</text>
  </g>
  <g transform="translate(300 860)"><use href="#d-otter" transform="scale(1.2)"/></g>
  <path id="p4-leg" d="M380 760 L 440 850" stroke="#B0703F" stroke-width="34" stroke-linecap="round"/>
  <path id="p4-path" d="M470 850 C 700 700 1100 760 1340 900" fill="none" stroke="#F7E6CC" stroke-width="40" stroke-linecap="round" opacity=".8"/>
  <path d="M470 850 C 700 700 1100 760 1340 900" fill="none" stroke="#D9B68A" stroke-width="6" stroke-dasharray="4 22" stroke-linecap="round"/>
  <g id="p4-arrow-out" transform="translate(900 700)"><path d="M-40 0 H 30 M10 -22 L 34 0 L 10 22" fill="none" stroke="#2B2A33" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="p4-arrow-back" display="none" transform="translate(900 700)"><path d="M40 0 H -30 M-10 -22 L -34 0 L -10 22" fill="none" stroke="#2B2A33" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="p4-ball"><g id="p4-ball-size"><use href="#d-ball"/></g></g>
  <g id="p4-knob" stroke="#2B2A33" stroke-width="6"><rect x="385" y="830" width="70" height="60" rx="18" fill="#FFCB3D"/></g>
  <g id="p4-thud-you" class="sb-digital" transform="translate(1340 760)"><text text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="70" fill="#E4483A" stroke="#fff" stroke-width="8" paint-order="stroke">THUD!</text></g>
  <g id="p4-thud-tiffin" class="sb-digital" transform="translate(470 700)"><text text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="70" fill="#E4483A" stroke="#fff" stroke-width="8" paint-order="stroke">THUD!</text></g>
